# Single simple-mode Python API deployed externally — no dev/stage pair.
# Adopt-into-simple is a different flow than the standard-pair adopt fixture:
# there is no stage to promote to and no develop scope question; the agent
# owns one immutable runtime. The python-hello-world-app repo's zerops.yaml
# hard-references `${db_hostname}` in env vars + an init migrate script, so
# the fixture MUST include a `db` service for buildFromGit to settle in
# ACTIVE state instead of FAILED on the init command.

services:
  - hostname: api
    type: python@3.12
    buildFromGit: https://github.com/zerops-recipe-apps/python-hello-world-app
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.25

  - hostname: db
    type: postgresql@18
    mode: NON_HA
    priority: 10
    verticalAutoscaling:
      minRam: 0.25
