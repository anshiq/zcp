# Fixture for local-auto-adopt-node-postgres-first-deploy.
#
# Pre-seeds eval-zcp with one nodejs runtime named `app` plus one
# postgresql managed service named `db`. No buildFromGit and no
# startWithoutCode: the runtime is created but never actually
# deployed — it stays in READY_TO_DEPLOY/NEW until the agent's first
# zerops_deploy from the local workdir lands real code.
#
# Why this state shape:
#   - LocalAutoAdopt classifies as local-stage (exactly one runtime →
#     auto-link as stage). FirstDeployedAt stays empty because status
#     is not ACTIVE → the eval observes a clean first-deploy code
#     path.
#   - postgresql is needed so the .env-bridge step has env vars to
#     discover (zerops_env action="generate-dotenv").

services:
  - hostname: app
    type: nodejs@22
    minContainers: 1
    maxContainers: 1
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 1
